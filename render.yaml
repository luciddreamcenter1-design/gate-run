# One-click hosting: https://render.com/deploy?repo=https://github.com/luciddreamcenter1-design/gate-run
# Render asks for COMFY_API_KEY during setup. Leave it blank to host for free (shipped roster, arenas, 1v1;
# visitors can paste their own Comfy key in the app). If set, visitors get a capped free tier on it. Never committed.
services:
  - type: web
    name: gate-run
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python3 server.py
    healthCheckPath: /app/
    envVars:
      - key: COMFY_API_KEY
        sync: false
      - key: FREE_LIMITS
        value: "1"
      - key: FREE_JOBS_PER_IP
        value: "14"
      - key: FREE_JOBS_PER_DAY
        value: "600"
      - key: PYTHON_VERSION
        value: "3.12.7"
